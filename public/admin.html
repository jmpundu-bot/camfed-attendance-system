<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMFED Admin</title><link rel="stylesheet" href="/style.css"></head>
<body class="purple-page"><div class="container"><div class="card"><img src="/images/camfed-logo.png" class="logo" alt="CAMFED logo" onerror="this.style.display='none'"><h1>CAMFED Attendance Admin</h1>
<section id="loginSection"><h2>Admin Login</h2><form id="loginForm"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button>Login</button><p id="loginMsg" class="message"></p></form></section>
<section id="dashboard" hidden><div class="admin-top"><h2>Events</h2><button id="logout" class="secondary">Logout</button></div><form id="eventForm" class="event-form"><input id="eventName" placeholder="Event name" required><input id="eventDate" type="date" required><input id="eventVenue" placeholder="Venue" required><button>Create Event</button></form><div id="events"></div></section>
</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const $=id=>document.getElementById(id); async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function check(){try{await api('/api/admin/me');$('loginSection').hidden=true;$('dashboard').hidden=false;loadEvents();}catch{}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});$('loginMsg').textContent='';check();}catch(x){$('loginMsg').className='message error';$('loginMsg').textContent=x.message;}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload();};
$('eventForm').onsubmit=async e=>{e.preventDefault();const submit=e.target.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;try{const result=await api('/api/admin/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('eventName').value,date:$('eventDate').value,venue:$('eventVenue').value})});e.target.reset();alert(result.message||'Event created.');await loadEvents();}catch(x){alert(x.message);}finally{if(submit)submit.disabled=false;}};
async function loadEvents(){const events=await api('/api/admin/events');$('events').innerHTML=events.length?'':'<p>No events yet.</p>';events.forEach(ev=>{const d=document.createElement('div');d.className='event-card';const expired=Date.now()>=Date.parse(ev.registration_expires_at||new Date(Date.parse(ev.created_at)+2*60*60*1000));const reportStatus=expired?`<p class="expiry-notice"><strong>Registration expired.</strong> Download the attendance PDF and CSV for this event.</p>`:'';d.innerHTML=`<h3>${esc(ev.name)}</h3><p>${esc(ev.date)} · ${esc(ev.venue)}</p><p><strong>${ev.attendee_count}</strong> attendees</p><p>Registration link: <a href="/register/${encodeURIComponent(ev.slug)}" target="_blank" rel="noopener"><code>${esc(location.origin)}/register/${esc(ev.slug)}</code></a> <button type="button" onclick="copyLink('${esc(ev.slug)}')">Copy Link</button></p><div class="event-qr"><img loading="lazy" width="160" height="160" alt="Registration QR code for ${esc(ev.name)}" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(location.origin + '/register/' + ev.slug)}"><p>Scan to register for this event</p></div><button type="button" onclick="downloadQrPdf('${esc(ev.name).replace(/'/g, "&#39;")}','${esc(ev.date)}','${esc(ev.venue).replace(/'/g, "&#39;")}','${esc(ev.slug)}')">Download QR Code (PDF)</button> <button onclick="view(${ev.id})">View Attendees</button> <button onclick="pdf(${ev.id})">Download PDF</button> <button onclick="csv(${ev.id})">Download CSV</button> <button class="danger" onclick="deleteEvent(${ev.id},'${esc(ev.name).replace(/'/g, '&#39;')}',${ev.attendee_count})">Delete Event</button>${reportStatus}<div id="list-${ev.id}"></div>`;$('events').appendChild(d);if(expired){const key='camfed-expiry-prompt-'+ev.id;if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'shown');setTimeout(()=>alert(`Registration for "${ev.name}" has expired. Use Download PDF and Download CSV on the event card to save the attendance reports.`),100);}}});}
async function copyLink(slug){const link=location.origin+'/register/'+slug;try{await navigator.clipboard.writeText(link);alert('Registration link copied.');}catch{prompt('Copy this registration link:',link);}}
async function downloadQrPdf(name,date,venue,slug){
  const link=location.origin+'/register/'+slug;
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=600x600&format=png&data='+encodeURIComponent(link);
  try {
    const response=await fetch(qrUrl); if(!response.ok) throw Error('Could not generate QR code. Check your internet connection and try again.');
    const blob=await response.blob(); const reader=new FileReader();
    reader.onload=()=>{
      if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF generator is unavailable. Check your internet connection and try again.');return;}
      const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
      doc.setFontSize(20); doc.text('CAMFED Event Registration',105,22,{align:'center'});
      doc.setFontSize(14); doc.text(String(name),105,35,{align:'center',maxWidth:175});
      doc.setFontSize(11); doc.text('Date: '+String(date),105,48,{align:'center'}); doc.text('Venue: '+String(venue),105,56,{align:'center',maxWidth:175});
      doc.addImage(reader.result,'PNG',55,68,100,100);
      doc.setFontSize(11); doc.text('Scan this QR code to register for the event',105,178,{align:'center'});
      doc.setFontSize(9); doc.text(link,105,188,{align:'center',maxWidth:180});
      const safeName=String(name).replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'event';
      doc.save('CAMFED_'+safeName+'_Registration_QR.pdf');
    }; reader.readAsDataURL(blob);
  } catch(e){alert(e.message||'Unable to download QR PDF. Please try again.');}
}
async function view(id){const x=await api('/api/admin/events/'+id+'/attendees');const box=$('list-'+id);box.innerHTML=x.attendees.length?'<div class="table-wrap"><table><tr><th>No.</th><th>Name</th><th>Gender</th><th>Designation</th><th>Organisation</th><th>Phone</th><th>NRC</th><th>District</th><th>Action</th></tr>'+x.attendees.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.full_name)}</td><td>${esc(a.gender)}</td><td>${esc(a.designation)}</td><td>${esc(a.organisation)}</td><td>${esc(a.phone_number)}</td><td>${esc(a.nrc_number)}</td><td>${esc(a.district)}</td><td><button class=\"danger\" onclick=\"deleteAttendee(${a.id},${id},'${esc(a.full_name).replace(/'/g, '&#39;')}')\">Delete</button></td></tr>`).join('')+'</table></div>':'<p>No attendees.</p>';}
async function deleteEvent(eventId,eventName,attendeeCount){
  const warning = `Delete the event "${eventName}" and all ${attendeeCount} attendee record(s)? This also removes saved signatures and cannot be undone.`;
  if(!confirm(warning)) return;
  try {
    const result = await api('/api/admin/events/'+eventId,{method:'DELETE'});
    alert(`Event deleted. ${result.deletedAttendees} attendee record(s) were also removed.`);
    await loadEvents();
  } catch(e) { alert(e.message); }
}
async function deleteAttendee(attendeeId,eventId,fullName){if(!confirm(`Delete the record for ${fullName}? This action cannot be undone.`))return;try{await api('/api/admin/attendees/'+attendeeId,{method:'DELETE'});await view(eventId);await loadEvents();}catch(e){alert(e.message);}}
setInterval(()=>{if(!$('dashboard').hidden)loadEvents().catch(()=>{});},30000);
function pdf(id){window.location.href='/api/admin/events/'+id+'/pdf';} function csv(id){window.location.href='/api/admin/events/'+id+'/csv';} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));} check();
</script></body></html>
